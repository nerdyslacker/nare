# Copy to ~/.config/nare/nare.conf and change only the values you need.

[main]
renderer=cpu
font=monospace
font-size=16
ligatures=yes
title=nare

[scrollback]
lines=10000

[url]
opener=xdg-open

[shell]
# Use nare after installing the bundled terminfo entry.
# term=nare
# output-pipe=/path/to/program

[security]
osc52=disabled

[graphics]
cache-size-mib=256
kitty-cache-size-mib=256
sixel-cache-size-mib=256
iterm2-cache-size-mib=256
max-images=4096
max-placements=65536
max-image-dimension=16384
max-image-pixels=16777216
max-image-size-mib=64
max-sixel-repeat=16384
max-sixel-colors=256
