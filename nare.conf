# Copy to ~/.config/nare/nare.conf and change only the values you need.

[main]
# auto | gpu | cpu
renderer=auto
font=JetBrainsMono Nerd Font Mono
bold-font=auto
italic-font=auto
bold-italic-font=auto
font-size=13
# yes | no
font-bold=no
cell-height-percent=110
cell-width-percent=102
# yes | no
ligatures=yes
title=nare

[cursor]
# block | beam | bar | underline
shape=block
# yes | no
blink=yes
blink-interval-ms=500
beam-width=2
underline-height=2

[scrollback]
lines=10000
# yes | no
scrollbar=yes

[window]
background-opacity=0.96
padding=4
# yes | no
decorations=yes
# yes | no
confirm-close=yes
# yes | no
audio-bell=no
# yes | no
copy-on-select=no
# splits,stack | stack,splits | splits | stack
enabled-layouts=splits,stack

[quake]
# Quake mode is opt-in; --quake overrides this value.
enabled=no
# focused | primary | XRandR output name
monitor=focused
position=top
width-percent=100
height-percent=40
# left | center | right
horizontal-align=center
x-offset=0
y-offset=0
hide-on-focus-loss=no
start-hidden=no
# none | slide | fade; unsupported compositor effects fall back to immediate transitions.
animation=slide
animation-duration-ms=140
keep-above=yes
skip-taskbar=yes

[tabs]
# yes | no
enabled=yes
# top | bottom
edge=top
# separator | hidden
style=separator
separator=" | "
minimum=1
title-template="{index}: {title}"
# bold | normal
active-font-style=bold

[statusbar]
# yes | no
enabled=yes
# top | bottom
position=bottom
height=24
# yes | no
border=no
# plain | blocks
module-style=blocks
# yes | no; reveal at the status-bar edge and hide after the pointer leaves.
auto-hide=no
# 0..10000
auto-hide-delay-ms=600
# mode | session | host | cwd | git | command | size | tabs | clock | battery | resource | zoom
left=mode,cwd,git
center=
right=resource,battery,size,zoom,clock
separator=" | "
# yes | no
show-in-quake=yes
background=#071C33
foreground=#B9C7DA
accent=#9C49FC

[statusbar.mode]
background=#9C49FC
foreground=#FFFDFD

[statusbar.session]
background=#132B46
foreground=#FFFDFD

[statusbar.host]
background=#193551
foreground=#D9E4F2

[statusbar.command]
background=#203E5B
foreground=#FFFDFD
update-ms=1000

[statusbar.size]
background=#203E5B
foreground=#FFFDFD

[statusbar.zoom]
background=#132B46
foreground=#FFFDFD

[statusbar.tabs]
background=#193551
foreground=#D9E4F2

[statusbar.clock]
background=#9C49FC
foreground=#FFFDFD
format="%H:%M"
update-ms=1000

[statusbar.cwd]
background=#102842
foreground=#FFFDFD
update-ms=2000

[statusbar.git]
background=#193551
foreground=#D9E4F2
update-ms=2000

[statusbar.battery]
background=#193551
foreground=#D9E4F2
update-ms=5000

[statusbar.resource]
background=#102842
foreground=#D9E4F2
update-ms=2000

[tmux]
# yes | no
enabled=yes
# yes | no
auto-detect=yes
# new-tab | new-window
default-target=new-tab
active-tab-color=#13BA19
# yes | no
auto-reconnect=no

[colors]
foreground=#FFFDFD
background=#011224
selection-foreground=#011224
selection-background=#9C49FC
cursor=#FFFDFD
cursor-text=#011224
url=#4FC3D9
active-border=#9C49FC
inactive-border=#334B68
bell-border=#FF6B7A
active-tab-foreground=#FFFDFD
active-tab-background=#9C49FC
inactive-tab-foreground=#B9C7DA
inactive-tab-background=#071C33
root-tab-background=#FF6B7A
tab-bar-background=#011224
color0=#071C33
color1=#FF6B7A
color2=#63D9A0
color3=#F6C96B
color4=#5E9CFF
color5=#9C49FC
color6=#4FC3D9
color7=#DCE6F2
color8=#425A76
color9=#FF8A97
color10=#83E6B5
color11=#FFD983
color12=#82B4FF
color13=#B977FF
color14=#70D9ED
color15=#FFFDFD

[bindings]
new-tab=alt+t
previous-tab=alt+left
next-tab=alt+right
close-pane=alt+w
split-horizontal=alt+enter
split-vertical=alt+shift+enter
focus-left=alt+shift+left
focus-right=alt+shift+right
focus-up=alt+up
focus-down=alt+down
toggle-stack=alt+shift+z
swap-pane=alt+shift+equal
move-tab-left=alt+control+shift+left
move-tab-right=alt+control+shift+right
copy=alt+c
paste=alt+v
zoom-in=alt+equal
zoom-out=alt+minus
zoom-reset=alt+0
tmux-new-tab=alt+control+t
tmux-new-window=alt+control+n
tmux-attach-last=alt+control+a
tmux-detach=alt+control+d
tmux-reconnect=alt+control+r
toggle-statusbar=alt+shift+b
# Named local or SSH tmux workspaces can be bound without shell commands.
# tmux-profile.dev=alt+control+1

# [tmux.profile.dev]
# ssh-host=dev
# session=main
# target=new-tab

[url]
opener=xdg-open

[shell]
# Directly executed command for local tabs and panes; empty uses $SHELL.
# Quotes and backslashes group arguments, for example: /usr/bin/fish --login
startup-command=
# Use nare after installing the bundled terminfo entry.
# term=nare
# output-pipe=/path/to/program

[security]
# disabled | copy-enabled | paste-enabled | enabled
osc52=disabled

[graphics]
cache-size-mib=256
kitty-cache-size-mib=256
sixel-cache-size-mib=256
iterm2-cache-size-mib=256
max-images=4096
max-placements=65536
max-image-dimension=16384
max-image-pixels=16777216
max-image-size-mib=64
max-sixel-repeat=16384
max-sixel-colors=256
