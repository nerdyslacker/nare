# Copy to ~/.config/nare/nare.conf and change only the values you need.
# Optional files are loaded in order, can appear between any sections, and
# paths are relative to this file. Later values override earlier values:
# include=bindings.conf
# include=themes/catppuccin-mocha.conf
# include=themes/catppuccin-latte.conf

[main]
# auto | gpu | cpu
renderer=auto
font=JetBrainsMono Nerd Font Mono
bold-font=auto
italic-font=auto
bold-italic-font=auto
# Font size in typographic points.
font-size=12
# yes | no; when enabled, bold ANSI colors 0-7 use bright colors 8-15.
bold-is-bright=no
cell-height-percent=110
cell-width-percent=102
# yes | no
ligatures=yes
title=nare

[cursor]
# block | beam | bar | underline
shape=block
# yes | no
blink=yes
blink-interval-ms=500
beam-width=2
underline-height=2

[scrollback]
lines=10000
# Per pane; oldest rows are discarded when either limit is reached.
max-size-mib=64
# yes | no
scrollbar=yes

[window]
background-opacity=0.96
padding=4
# Initial normal-window size in pixels. Ignored when remember-size has saved a size.
width=800
height=480
# yes | no; remember the last manually resized, non-maximized normal window.
remember-size=no
# yes | no
decorations=yes
# yes | no
confirm-close=yes
# yes | no
audio-bell=no
# yes | no
copy-on-select=no
# splits,stack | stack,splits | splits | stack
enabled-layouts=splits,stack

[quake]
# Quake mode is opt-in; --quake overrides this value.
enabled=no
# focused | primary | XRandR output name
monitor=focused
position=top
width-percent=100
height-percent=40
# left | center | right
horizontal-align=center
x-offset=0
y-offset=0
hide-on-focus-loss=no
start-hidden=no
# none | slide | fade; unsupported compositor effects fall back to immediate transitions.
animation=slide
animation-duration-ms=140
keep-above=yes
skip-taskbar=yes

[tabs]
# yes | no
enabled=yes
# top | bottom
edge=top
# separator | hidden
style=separator
separator=" | "
minimum=1
title-template="{index}: {title}"
# bold | normal
active-font-style=bold

[statusbar]
# yes | no
enabled=yes
# top | bottom
position=bottom
height=24
# yes | no
border=no
# plain | blocks
module-style=blocks
# yes | no; reveal at the status-bar edge and hide after the pointer leaves.
auto-hide=no
# 0..10000
auto-hide-delay-ms=600
# mode | session | host | cwd | git | command | size | tabs | clock | battery | resource | zoom | jobs
left=mode,cwd,git
center=
right=resource,battery,size,zoom,clock,jobs
separator=" | "
# yes | no
show-in-quake=yes
background=#071C33
foreground=#B9C7DA
accent=#9C49FC

[statusbar.mode]
background=#9C49FC
foreground=#FFFDFD

[statusbar.session]
background=#132B46
foreground=#FFFDFD

[statusbar.host]
background=#193551
foreground=#D9E4F2

[statusbar.command]
background=#203E5B
foreground=#FFFDFD
update-ms=1000

[statusbar.size]
background=#203E5B
foreground=#FFFDFD
# Text or glyph; empty removes the label.
label=""

[statusbar.zoom]
background=#132B46
foreground=#FFFDFD
label=""

[statusbar.tabs]
background=#193551
foreground=#D9E4F2

[statusbar.clock]
background=#9C49FC
foreground=#FFFDFD
label="󰃰"
format="%H:%M:%S"
update-ms=1000

[statusbar.cwd]
background=#102842
foreground=#FFFDFD
# yes | no
full-path=no
# Collapsed depth marker; for example ".." or "".
depth-marker=""
update-ms=2000

[statusbar.git]
background=#193551
foreground=#D9E4F2
label=""
update-ms=2000

[statusbar.battery]
background=#193551
foreground=#D9E4F2
label="󰂄"
update-ms=5000

[statusbar.resource]
background=#102842
foreground=#D9E4F2
network-label=""
cpu-label=""
ram-label=""
storage-label="󰋊"
update-ms=2000

[statusbar.jobs]
# yes | no
enabled=yes
label=""
# 1..16
max-visible=3
# yes | no
show-elapsed=yes
show-completed=yes
show-failed=yes
show-progress=yes
# Seconds; 0 removes the state immediately.
completed-timeout=10
failed-timeout=30
# running-first | newest
sort=running-first
# window
scope=window
background=#132B46
foreground=#FFFDFD
success-background=#237A4B
failure-background=#A83246

[tmux]
# yes | no
enabled=yes
# yes | no
auto-detect=yes
# new-tab | new-window
default-target=new-tab
active-tab-color=#13BA19
# yes | no
auto-reconnect=no

[colors]
foreground=#FFFDFD
background=#011224
selection-foreground=#011224
selection-background=#9C49FC
cursor=#FFFDFD
cursor-text=#011224
url=#4FC3D9
active-border=#9C49FC
inactive-border=#334B68
bell-border=#FF6B7A
active-tab-foreground=#FFFDFD
active-tab-background=#9C49FC
inactive-tab-foreground=#B9C7DA
inactive-tab-background=#071C33
root-tab-background=#FF6B7A
tab-bar-background=#011224
color0=#071C33
color1=#FF6B7A
color2=#63D9A0
color3=#F6C96B
color4=#5E9CFF
color5=#9C49FC
color6=#4FC3D9
color7=#DCE6F2
color8=#425A76
color9=#FF8A97
color10=#83E6B5
color11=#FFD983
color12=#82B4FF
color13=#B977FF
color14=#70D9ED
color15=#FFFDFD

[bindings]
new-tab=alt+t
previous-tab=alt+left
next-tab=alt+right
close-pane=alt+w
split-horizontal=alt+enter
split-vertical=alt+shift+enter
focus-left=alt+shift+left
focus-right=alt+shift+right
focus-up=alt+up
focus-down=alt+down
toggle-stack=alt+shift+z
swap-pane=alt+shift+equal
move-tab-left=alt+control+shift+left
move-tab-right=alt+control+shift+right
copy=alt+c
paste=alt+v
zoom-in=alt+equal
zoom-out=alt+minus
zoom-reset=alt+0
tmux-new-tab=alt+control+t
tmux-new-window=alt+control+n
tmux-attach-last=alt+control+a
tmux-detach=alt+control+d
tmux-reconnect=alt+control+r
toggle-statusbar=alt+shift+b
show-jobs=alt+shift+j
# Reload this file; parse errors leave the current configuration unchanged.
reload-config=alt+shift+r
# Named command rule example:
tab.editor=alt+1
# Named local or SSH tmux workspaces can be bound without shell commands.
# tmux-profile.dev=alt+control+1

[tab.editor]
command=nvim .
working-directory=~/Projects
title=Editor
# new-tab | new-pane-horizontal | new-pane-vertical | new-window
target=new-tab
# focus | always-new
reuse=focus
# yes | no; records this command in the lifecycle registry.
track-job=no
job-name=editor

# [tmux.profile.dev]
# ssh-host=dev
# session=main
# target=new-tab

[url]
opener=xdg-open

[shell]
# Directly executed command for local tabs and panes; empty uses $SHELL.
# Quotes and backslashes group arguments, for example: /usr/bin/fish --login
startup-command=
# Use nare after installing the bundled terminfo entry.
# term=nare
# output-pipe=/path/to/program

[security]
# disabled | copy-enabled | paste-enabled | enabled
osc52=disabled

[graphics]
cache-size-mib=64
kitty-cache-size-mib=64
sixel-cache-size-mib=64
iterm2-cache-size-mib=64
max-images=4096
max-placements=65536
max-image-dimension=16384
max-image-pixels=16777216
max-image-size-mib=64
max-sixel-repeat=16384
max-sixel-colors=256
